[project]
name = "clean-center-tools"
version = "0.1.0"
description = "Herramientas de verificación y automatización para Clean Center"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
