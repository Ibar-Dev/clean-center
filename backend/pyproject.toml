[project]
name = "clean-center-api"
version = "0.1.0"
description = "API de reservas Click & Collect para Clean Center"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlmodel>=0.0.48,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.12,<3",
    "email-validator>=2.3,<3",
    "pyjwt>=2.15,<3",
    "pwdlib[argon2]>=0.3,<1",
    "slowapi>=0.1.10,<1",
    "loguru>=0.7.3,<1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
